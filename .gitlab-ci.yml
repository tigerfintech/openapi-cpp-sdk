# TigerOpen C++ SDK — CI pipeline
#
# Two-stage pipeline mirroring the Python SDK:
#   unit-test:       builds tigerapi + tests, runs unit tests (no credentials)
#   integration-test: runs against live sandbox (allow_failure; needs credentials)
#   notify:webhook:  parses JUnit XML artifacts → Feishu card (python urllib, no curl)
#
# Uses a Docker executor (gcc:13) tagged 'openapi'. Boost is installed via apt
# (libboost-dev) to avoid the unreliable archives.boost.org download. Abseil,
# cpprestsdk, and GoogleTest are still built from source by
# scripts/build_linux_mac.sh.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).
# The C++ tests read TIGER_TEST_ID / TIGER_TEST_PRIVATE_KEY / TIGER_TEST_ACCOUNT,
# which are mapped below from the TIGEROPEN_* variables.

stages:
  - unit-test
  - integration-test

variables:
  BUILD_DIR: build_ci
  CTEST_OUTPUT_ON_FAILURE: "1"

# Shared setup: install Boost + build tools via apt (Docker root, no sudo),
# then set dependency prefixes. BOOST_ROOT points to /usr so the build script
# finds the apt-installed Boost and skips the GitHub download. Protobuf,
# Abseil, cpprestsdk, and GoogleTest are built from source to a local prefix.
.cpp_base:
  image: gcc:13
  tags:
    - openapi
  before_script:
    - apt-get clean && rm -rf /var/lib/apt/lists/* && apt-get update
    - apt-get install -y --no-install-recommends cmake pkg-config wget libboost-all-dev libssl-dev zlib1g-dev libwebsocketpp-dev
    - |
      export LOCAL_OPT_PREFIX="${CI_PROJECT_DIR}/.deps/opt"
      export BOOST_ROOT="/usr"
      export CPPREST_PREFIX="${LOCAL_OPT_PREFIX}/cpprestsdk"
      export ABSL_PREFIX="${LOCAL_OPT_PREFIX}/abseil-20240722.0"
      export PROTOBUF_PREFIX="${LOCAL_OPT_PREFIX}/protobuf-v5.28.3"
      export GTEST_PREFIX="${LOCAL_OPT_PREFIX}/googletest-v1.14.0"
      export SDK_INSTALL_PREFIX="${CI_PROJECT_DIR}/output/Linux"
      export SDK_INCLUDE_PREFIX="${SDK_INSTALL_PREFIX}"
      export BUILD_TYPE=Release
      export BUILD_TYPES=Release
      export SKIP_DEMO=1
      export SKIP_INCLUDE_COPY=1

unit-test:
  extends: .cpp_base
  stage: unit-test
  script:
    - chmod +x scripts/build_linux_mac.sh
    # Build tigerapi + deps (Boost found via apt; Protobuf/Abseil/cpprestsdk/GTest from source)
    - ./scripts/build_linux_mac.sh
    # Detect GTest cmake config dir (lib vs lib64) after build
    - GTEST_CONFIG=$(find "$GTEST_PREFIX" -name "GTestConfig.cmake" 2>/dev/null | head -1); GTEST_CMAKE_DIR=""; [[ -n "$GTEST_CONFIG" ]] && GTEST_CMAKE_DIR=$(dirname "$GTEST_CONFIG")
    # Build tests
    - |
      cmake -S . -B "$BUILD_DIR" \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_TESTS=ON \
        -DBOOST_ROOT="$BOOST_ROOT" \
        -DBOOST_MIN_VERSION=1.74 \
        -DPROTOBUF_PREFIX="$PROTOBUF_PREFIX" \
        -DABSL_PREFIX="$ABSL_PREFIX" \
        -DCPPREST_PREFIX="$CPPREST_PREFIX" \
        ${GTEST_CMAKE_DIR:+-DGTest_DIR="$GTEST_CMAKE_DIR"} \
        -DCMAKE_PREFIX_PATH="$PROTOBUF_PREFIX;$ABSL_PREFIX;$CPPREST_PREFIX;$BOOST_ROOT;$GTEST_PREFIX" \
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    - cmake --build "$BUILD_DIR" --target unit_tests -j$(nproc)
    # GTEST_OUTPUT makes gtest write JUnit XML for GitLab's junit report artifact
    - mkdir -p test-results
    - export GTEST_OUTPUT=xml:$CI_PROJECT_DIR/test-results/unit.xml
    - ctest --test-dir "$BUILD_DIR" -R UnitTests -V
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/unit.xml
    expire_in: 1 week

integration-test:
  extends: .cpp_base
  stage: integration-test
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
    # Map TIGEROPEN_* CI Variables → TIGER_TEST_* env vars expected by test_support.h
    TIGER_TEST_ID: $TIGEROPEN_TIGER_ID
    TIGER_TEST_PRIVATE_KEY: $TIGEROPEN_PRIVATE_KEY
    TIGER_TEST_ACCOUNT: $TIGEROPEN_ACCOUNT
  script:
    - chmod +x scripts/build_linux_mac.sh
    - ./scripts/build_linux_mac.sh
    - GTEST_CONFIG=$(find "$GTEST_PREFIX" -name "GTestConfig.cmake" 2>/dev/null | head -1); GTEST_CMAKE_DIR=""; [[ -n "$GTEST_CONFIG" ]] && GTEST_CMAKE_DIR=$(dirname "$GTEST_CONFIG")
    - |
      cmake -S . -B "$BUILD_DIR" \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_TESTS=ON \
        -DBOOST_ROOT="$BOOST_ROOT" \
        -DBOOST_MIN_VERSION=1.74 \
        -DPROTOBUF_PREFIX="$PROTOBUF_PREFIX" \
        -DABSL_PREFIX="$ABSL_PREFIX" \
        -DCPPREST_PREFIX="$CPPREST_PREFIX" \
        ${GTEST_CMAKE_DIR:+-DGTest_DIR="$GTEST_CMAKE_DIR"} \
        -DCMAKE_PREFIX_PATH="$PROTOBUF_PREFIX;$ABSL_PREFIX;$CPPREST_PREFIX;$BOOST_ROOT;$GTEST_PREFIX" \
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    - cmake --build "$BUILD_DIR" --target integ_tests -j$(nproc)
    - mkdir -p test-results
    - export GTEST_OUTPUT=xml:$CI_PROJECT_DIR/test-results/integ.xml
    - ctest --test-dir "$BUILD_DIR" -R IntegTests -V
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/integ.xml
    expire_in: 1 week

# Pipeline result notification via Feishu/Lark webhook.
# Parses JUnit XML artifacts directly (no GitLab API, no curl).
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  stage: .post
  when: always
  allow_failure: true
  needs:
    - job: unit-test
      artifacts: true
    - job: integration-test
      artifacts: true
  script:
    - |
      python3 << 'PYEOF'
      import os, json, urllib.request, glob
      import xml.etree.ElementTree as ET

      webhook_url = os.environ.get("WEBHOOK_URL", "")
      if not webhook_url:
          print("WEBHOOK_URL not configured, skipping notification")
          exit(0)

      # 1. Parse JUnit XML artifacts — split unit/integration stats
      def parse_xml(path):
          t, f, s = 0, 0, 0
          try:
              tree = ET.parse(path)
              root = tree.getroot()
              for suite in root.iter("testsuite"):
                  t += int(suite.get("tests", 0))
                  f += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s += int(suite.get("skipped", 0))
          except Exception as e:
              print(f"Failed to parse {path}: {e}")
          return t, t - f - s, f, s

      unit_t, unit_p, unit_f, unit_s = parse_xml("test-results/unit.xml")
      integ_t, integ_p, integ_f, integ_s = parse_xml("test-results/integ.xml")

      unit_stats = f"Unit: {unit_t} tests: {unit_p} passed, {unit_f} failed, {unit_s} skipped" if unit_t > 0 else ""
      integ_stats = f"Integration: {integ_t} tests: {integ_p} passed, {integ_f} failed, {integ_s} skipped" if integ_t > 0 else ""

      # 2. Determine pass/fail: unit test failures = pipeline failed
      has_failed = unit_f > 0 or integ_f > 0
      status = os.environ.get("CI_PIPELINE_STATUS", "")
      if status == "failed":
          has_failed = True

      # 3. Build Feishu card
      title = "❌ Pipeline failed" if has_failed else "✅ Pipeline passed"
      color = "red" if has_failed else "green"
      project_name = os.environ.get("CI_PROJECT_NAME", "")
      branch = os.environ.get("CI_COMMIT_REF_NAME", "")
      commit = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      pipeline_iid = os.environ.get("CI_PIPELINE_IID", "")
      pipeline_url = os.environ.get("CI_PROJECT_URL", "") + "/-/pipelines/" + os.environ.get("CI_PIPELINE_ID", "")

      content = f"**Repo:** {project_name}\n**Branch:** {branch}\n**Commit:** {commit}\n"
      if unit_stats:
          content += f"\n**Unit tests:** {unit_stats}\n"
      if integ_stats:
          content += f"**Integration tests:** {integ_stats}\n"
      content += f"[View pipeline]({pipeline_url})"

      payload = {
          "msg_type": "interactive",
          "card": {
              "header": {
                  "title": {"tag": "plain_text", "content": f"{title} #{pipeline_iid} — {project_name}"},
                  "template": color
              },
              "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content": content}}
              ]
          }
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
      try:
          with urllib.request.urlopen(req, timeout=10) as resp:
              result = json.loads(resp.read())
              print(f"Feishu response: {result}")
      except Exception as e:
          print(f"Feishu webhook failed: {e}")
      PYEOF
