# TigerOpen C++ SDK — CI pipeline
#
# unit-test: builds tigerapi + tests, runs unit tests (no credentials needed)
# integration-test: runs against live sandbox (manual; needs real credentials)
#
# The runner is a shell executor with no sudo (no tty / no askpass).
# Dependencies (Boost, Abseil, Protobuf, cpprestsdk, GoogleTest) are built
# from source to a project-relative prefix by scripts/build_linux_mac.sh.
# Only basic build tools (cmake, gcc, g++, make, git, tar, wget) must be
# pre-installed on the runner.

stages:
  - unit-test
  - integration-test

variables:
  BUILD_DIR: build_ci
  CTEST_OUTPUT_ON_FAILURE: "1"

# Shared setup: redirect all dependency prefixes to a project-relative
# directory so that no sudo is required. The build script detects CI mode
# via CI_PIPELINE_ID and skips sudo package installation automatically.
.cpp_setup: &cpp_setup
  - |
    export LOCAL_OPT_PREFIX="${CI_PROJECT_DIR}/.deps/opt"
    export BOOST_ROOT="${LOCAL_OPT_PREFIX}/boost_1_86_0"
    export CPPREST_PREFIX="${LOCAL_OPT_PREFIX}/cpprestsdk"
    export ABSL_PREFIX="${LOCAL_OPT_PREFIX}/abseil-20240722.0"
    export PROTOBUF_PREFIX="${LOCAL_OPT_PREFIX}/protobuf-v5.28.3"
    export GTEST_PREFIX="${LOCAL_OPT_PREFIX}/googletest-v1.14.0"
    export SDK_INSTALL_PREFIX="${CI_PROJECT_DIR}/output/Linux"
    export SDK_INCLUDE_PREFIX="${SDK_INSTALL_PREFIX}"
    export BUILD_TYPE=Release
    export BUILD_TYPES=Release
    export SKIP_DEMO=1
    export SKIP_INCLUDE_COPY=1

unit-test:
  stage: unit-test
  before_script:
    - *cpp_setup
  script:
    - chmod +x scripts/build_linux_mac.sh
    # Build tigerapi + all dependencies (Boost / Protobuf / Abseil / cpprestsdk / GTest)
    - ./scripts/build_linux_mac.sh
    # Detect GTest cmake config dir (lib vs lib64) after build
    - GTEST_CONFIG=$(find "$GTEST_PREFIX" -name "GTestConfig.cmake" 2>/dev/null | head -1); GTEST_CMAKE_DIR=""; [[ -n "$GTEST_CONFIG" ]] && GTEST_CMAKE_DIR=$(dirname "$GTEST_CONFIG")
    # Build tests ─────────────────────────────────────────────────────────────
    - |
      cmake -S . -B "$BUILD_DIR" \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_TESTS=ON \
        -DBOOST_ROOT="$BOOST_ROOT" \
        -DPROTOBUF_PREFIX="$PROTOBUF_PREFIX" \
        -DABSL_PREFIX="$ABSL_PREFIX" \
        -DCPPREST_PREFIX="$CPPREST_PREFIX" \
        ${GTEST_CMAKE_DIR:+-DGTest_DIR="$GTEST_CMAKE_DIR"} \
        -DCMAKE_PREFIX_PATH="$PROTOBUF_PREFIX;$ABSL_PREFIX;$CPPREST_PREFIX;$BOOST_ROOT;$GTEST_PREFIX" \
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    - cmake --build "$BUILD_DIR" --target unit_tests -j$(nproc)
    # GTEST_OUTPUT makes gtest write JUnit XML for GitLab's junit report artifact
    - export GTEST_OUTPUT=xml:$BUILD_DIR/unit_test_results.xml
    - ctest --test-dir "$BUILD_DIR" -R UnitTests -V
  artifacts:
    reports:
      junit: "$BUILD_DIR/unit_test_results.xml"
    when: always
    expire_in: 1 week

integration-test:
  stage: integration-test
  when: manual
  before_script:
    - *cpp_setup
  script:
    - chmod +x scripts/build_linux_mac.sh
    - ./scripts/build_linux_mac.sh
    - GTEST_CONFIG=$(find "$GTEST_PREFIX" -name "GTestConfig.cmake" 2>/dev/null | head -1); GTEST_CMAKE_DIR=""; [[ -n "$GTEST_CONFIG" ]] && GTEST_CMAKE_DIR=$(dirname "$GTEST_CONFIG")
    - |
      cmake -S . -B "$BUILD_DIR" \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_TESTS=ON \
        -DBOOST_ROOT="$BOOST_ROOT" \
        -DPROTOBUF_PREFIX="$PROTOBUF_PREFIX" \
        -DABSL_PREFIX="$ABSL_PREFIX" \
        -DCPPREST_PREFIX="$CPPREST_PREFIX" \
        ${GTEST_CMAKE_DIR:+-DGTest_DIR="$GTEST_CMAKE_DIR"} \
        -DCMAKE_PREFIX_PATH="$PROTOBUF_PREFIX;$ABSL_PREFIX;$CPPREST_PREFIX;$BOOST_ROOT;$GTEST_PREFIX" \
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    - cmake --build "$BUILD_DIR" --target integ_tests -j$(nproc)
    - TIGER_RUN_INTEG=true ctest --test-dir "$BUILD_DIR" -R IntegTests -V
  environment:
    name: sandbox
  variables:
    TIGER_RUN_INTEG: "true"
