syntax = "proto3";
import public "SocketCommon.proto";

package tigeropen.push.pb;

message Request {
  SocketCommon.Command command = 1;
  uint32 id = 2;
  Subscribe subscribe = 3;
  Connect connect = 4;

  message Connect {
    string tigerId = 1;
    string sign = 2;
    string sdkVersion = 3;
    string acceptVersion = 4;
    uint32 sendInterval = 5;
    uint32 receiveInterval = 6;
    bool useFullTick = 7;
  }

  message Subscribe {
    SocketCommon.DataType dataType = 1;
    string symbols = 2;
    string account = 3;
    string market = 4;
    // 资产行情口径，取 AssetQuoteType 枚举名：ETH / RTH / OVERNIGHT。
    // 仅对 dataType = Asset / Position 生效；不传则按 ETH 处理，与该字段存在前的行为一致。
    string assetQuoteType = 5;
  }
}